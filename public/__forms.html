<!DOCTYPE html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <title>Form definitions</title>
  </head>
  <body>
    <!--
      Static "blueprint" copy of the Eiendomly order form, used only so
      Netlify's build-time form scanner can register its fields. The real
      form the user sees and submits lives in
      src/components/eiendomly/order-form.tsx (rendered by Next.js);
      Netlify's Next.js Runtime (v5) can't introspect that dynamically
      rendered output to detect data-netlify forms, so it needs this plain
      static HTML copy in /public instead. Field names must stay in sync
      with the real form. This page is never linked to and is not meant
      to be visited directly.
    -->
    <form name="bestilling" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="bestilling" />
      <input type="hidden" name="language" />
      <input type="hidden" name="utm_source" />
      <input type="hidden" name="utm_medium" />
      <input type="hidden" name="utm_campaign" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="customer_type" />
      <input type="text" name="service" />
      <input type="url" name="photos_link" />
      <textarea name="message"></textarea>
      <input type="checkbox" name="rights_confirmed" />
      <input type="checkbox" name="marketing_consent" />
    </form>
  </body>
</html>
